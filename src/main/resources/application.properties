server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/turf_management?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
server.error.include-message=always
app.jwt.secret=${JWT_SECRET:local-dev-secret-change-this-to-at-least-32-characters-long}
app.jwt.expiration-ms=86400000
app.cors.origin=${FRONTEND_ORIGIN:http://localhost:5173}
